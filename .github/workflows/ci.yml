name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check app tests migrations
      - run: ruff format --check app tests
      - run: mypy
      - run: pytest

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t kubidoor:ci .
      - name: Container runs as non-root and starts
        run: |
          test "$(docker run --rm --entrypoint id kubidoor:ci -u)" = "10001"
          docker run -d --name kd -p 8000:8000 -e KUBIDOOR_KUBERNETES__KUBECONFIG=/nonexistent kubidoor:ci
          for i in $(seq 1 20); do curl -fs localhost:8000/health && break || sleep 1; done
          curl -fs localhost:8000/health

  e2e-kind:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: helm/kind-action@v1
        with:
          cluster_name: kubidoor
      - run: pip install -e ".[dev]"
      - run: ./scripts/demo-scenarios.sh apply
      # The control workload must be fully rolled out first: a slow image pull on a busy runner
      # would otherwise look like a genuine incident and make the "healthy stays quiet" check fail.
      - run: kubectl --context kind-kubidoor -n kubidoor-demo rollout status deploy/demo-healthy --timeout=240s
      - run: KUBIDOOR_E2E=1 python -m pytest -m e2e tests/e2e -o addopts="-ra" -vv --tb=long
      - name: Cluster state (only when a step failed)
        if: failure()
        run: |
          kubectl --context kind-kubidoor -n kubidoor-demo get deploy,pods -o wide || true
          kubectl --context kind-kubidoor -n kubidoor-demo describe pods | tail -n 150 || true
          kubectl --context kind-kubidoor -n kubidoor-demo get events --sort-by=.lastTimestamp | tail -n 40 || true
