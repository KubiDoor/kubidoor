<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>KubiDoor</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2312252E'/%3E%3Cpath d='M9 26V14a7 7 0 0 1 14 0v12z' fill='none' stroke='%23D8B15A' stroke-width='2.4'/%3E%3Ccircle cx='19.5' cy='19.5' r='1.6' fill='%23D8B15A'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <div class="app">
    <aside class="rail" aria-label="Primary">
      <a class="brand" href="#/overview" aria-label="KubiDoor home">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M7 28V14a9 9 0 0 1 18 0v14z"/><circle cx="20.5" cy="20.5" r="1.8"/></svg>
        <span class="brand-name">KubiDoor</span>
      </a>
      <nav id="nav" class="nav"></nav>
      <div class="rail-foot">
        <button id="themeBtn" class="ghost" type="button" aria-label="Switch colour theme"></button>
      </div>
    </aside>

    <div class="main">
      <header class="top">
        <div class="top-left">
          <h1 id="pageTitle">Overview</h1>
          <p id="pageSub" class="sub"></p>
        </div>
        <div class="top-right">
          <div id="pills" class="pills" aria-live="polite"></div>
          <button id="liveBtn" class="chip live" type="button" aria-pressed="true">Live</button>
          <button id="refreshBtn" class="ghost icon-btn" type="button" aria-label="Refresh now"></button>
          <button id="whoBtn" class="chip" type="button" aria-label="Change your name and access token"></button>
        </div>
      </header>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>

  <div id="drawerMount"></div>
  <div id="toasts" role="status" aria-live="polite"></div>
  <dialog id="dlg"></dialog>
  <script src="app.js" defer></script>
</body>
</html>
