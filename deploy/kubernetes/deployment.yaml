apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubidoor
  namespace: kubidoor
  labels:
    app.kubernetes.io/name: kubidoor
spec:
  replicas: 1          # single replica: SQLite + one monitoring loop. Do not scale without PostgreSQL.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kubidoor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubidoor
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: kubidoor
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kubidoor
          image: kubidoor:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: kubidoor-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir: {}      # use a PersistentVolumeClaim (or PostgreSQL) to keep history across restarts
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kubidoor
  namespace: kubidoor
  labels:
    app.kubernetes.io/name: kubidoor
spec:
  selector:
    app.kubernetes.io/name: kubidoor
  ports:
    - name: http
      port: 8000
      targetPort: http
