# OPTIONAL. Apply ONLY if you enable recovery (KUBIDOOR_RECOVERY__ENABLED=true).
# Namespaced Role, so write access exists only inside the namespaces you choose; copy this
# Role + RoleBinding into each namespace listed in recovery.allowed_namespaces.
# Grants exactly what the two supported actions need: patch a Deployment (rollout restart)
# and delete a Pod. Nothing else: no Secrets, no Nodes, no PV/PVC, no RBAC, no exec.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubidoor-recovery
  namespace: kubidoor-demo
  labels:
    app.kubernetes.io/name: kubidoor
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubidoor-recovery
  namespace: kubidoor-demo
  labels:
    app.kubernetes.io/name: kubidoor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubidoor-recovery
subjects:
  - kind: ServiceAccount
    name: kubidoor
    namespace: kubidoor
